# Публикация в npm — по тегу, и только по нему.
#
# Тег ставит человек; всё остальное делает эта работа. Публикация почти необратима (снять
# версию можно лишь в первые 72 часа, и то не всегда), поэтому перед ней стоят два барьера:
#
#   1. оба корпуса должны пройти. Выложить инструмент, который не проходит собственную
#      проверку, — ровно то заявление сверх доказательств, которое он у карточек не принимает;
#   2. версия в теге обязана совпадать с версией в package.json. Иначе в реестр уезжает не то,
#      что человек имел в виду, и исправить это уже нечем.
#
# Пакет подписывается происхождением (--provenance): реестр сохраняет доказательство, что эта
# версия собрана из этого репозитория и этого коммита, а не собрана кем-то у себя на машине.
#
# В реестр работа входит без ключа — trusted publishing: npm сверяет OIDC-токен GitHub Actions
# с доверенным издателем пакета на npmjs (nistoc/usedesign, publish.yml). Раньше здесь был ключ
# в secret, но ключ на запись живёт не дольше 90 дней: прежний, от 10.08.2026, истекал 08.11.2026,
# и с истёкшим ключом выпуск падал бы на последнем шаге. Без ключа истекать нечему.

name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Собрать и проверить, но НЕ публиковать'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # вход в npm по OIDC (trusted publishing) и подпись --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl/typescript
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build

      - name: Оба корпуса
        run: node dist/cli.js conformance

      - name: Версия в теге совпадает с версией пакета
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "тег: $TAG · package.json: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::тег v$TAG не совпадает с версией пакета $PKG — публикация остановлена"
            exit 1
          fi

      # Проверка коробки, а не исходников: пакет ставится в пустой каталог и запускается там,
      # где нашего репозитория нет. Схема лежит внутри пакета — если она вдруг не попадёт,
      # инструмент упадёт именно здесь, а не у первого постороннего.
      #
      # Коробку спрашивают и о её собственной версии. Барьер добавлен после того, как
      # опубликованная 0.3.0 представилась как 0.2.0: строка была захардкожена, и никто её ни с
      # чем не сравнивал. Инструмент, который проверяет чужие заявления против кода, обязан
      # выдерживать ту же проверку сам — иначе всякая будущая диагностика начинается со лжи.
      - name: Коробка работает у постороннего
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          npm pack --pack-destination /tmp
          mkdir -p /tmp/boxtest && cd /tmp/boxtest
          npm init -y >/dev/null
          npm install /tmp/usedesign-*.tgz --no-audit --no-fund
          SAID="$(npx usedesign --version)"
          echo "коробка о себе: $SAID · package.json: $PKG"
          case "$SAID" in
            *"$PKG"*) ;;
            *) echo "::error::коробка называет себя «$SAID», а версия пакета $PKG"; exit 1 ;;
          esac
          npx usedesign validate "$GITHUB_WORKSPACE/examples/library/"

      # Trusted publishing требует npm 11.5.1 или новее, а Node 22 приносит npm 10. Шаг идёт и в
      # холостом прогоне — так workflow_dispatch с dry_run проверяет его до настоящего тега.
      # Барьер на версию: если npm окажется старше, публиковать он будет уже без ключа и упадёт
      # на последнем шаге — пусть лучше остановится здесь и скажет почему.
      - name: npm, который входит в реестр по OIDC
        run: |
          set -euo pipefail
          npm install -g npm@11 --no-audit --no-fund
          V="$(npm --version)"
          echo "npm: $V · node: $(node --version)"
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$V"; then
            echo "::error::npm $V — для trusted publishing нужен 11.5.1 или новее"
            exit 1
          fi

      # Ключа нет: npm берёт OIDC-токен этой работы и меняет его в реестре на разовый. Если на
      # npmjs у пакета не настроен доверенный издатель (nistoc/usedesign, publish.yml), реестр
      # откажет здесь, и версия не выйдет.
      - name: Опубликовать
        if: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true }}
        run: npm publish --access public --provenance

      # «Опубликовано» ещё не значит «доступно»: реестр обрабатывает пакет минуты, и ОБА его лица
      # отстают по-разному — 0.12.0: метаданные сразу, архив через ~6 мин; 0.13.0: и метаданные,
      # и архив через ~8 мин. Зелёный прогон обязан значить «коробка ставится и отвечает у
      # постороннего ИЗ РЕЕСТРА», иначе тот, кто поднимает пин по зелёному, получает 404.
      - name: Коробка доступна из реестра
        if: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true }}
        run: |
          set -uo pipefail
          PKG="$(node -p "require('./package.json').version")"
          mkdir -p /tmp/regprobe && cd /tmp/regprobe
          START=$(date +%s)
          for i in $(seq 1 45); do
            SAID="$(npx --yes "usedesign@$PKG" --version 2>/dev/null || true)"
            case "$SAID" in
              *"$PKG"*)
                echo "коробка usedesign@$PKG отвечает из реестра через $(( $(date +%s) - START )) с: $SAID"
                echo "- доступна из реестра через $(( $(date +%s) - START )) с" >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
            esac
            sleep 20
          done
          echo "::error::usedesign@$PKG опубликована, но за 15 минут так и не стала доступна из реестра — пин по этому прогону поднимать НЕЛЬЗЯ"
          exit 1

      - name: Сводка
        if: always()
        run: |
          {
            echo "## usedesign — публикация"
            echo
            echo "- версия пакета: \`$(node -p "require('./package.json').version")\`"
            echo "- ссылка: https://www.npmjs.com/package/usedesign"
          } >> "$GITHUB_STEP_SUMMARY"
