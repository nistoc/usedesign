# The corpus is what stops "a valid card" from becoming "a card my validator happens to accept".
# This workflow is what stops the corpus from becoming a file nobody runs.
#
# Four things are checked, and the third is the one that usually goes missing:
#   1. the reference implementation passes both corpora;
#   2. the prototype passes them too, on a different runtime — a corpus one implementation agrees
#      with is a corpus that has stopped describing the format;
#   3. the deliberately rotten fixture still FAILS. A checker that has quietly stopped checking
#      reports success, which is indistinguishable from a healthy repository unless something
#      insists on seeing the failure;
#   4. the two implementations say the same thing about the same input: the same codes on the
#      fixture, the same lines on the paths `validate` takes (the `agreement` job).

name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typescript:
    name: reference implementation (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    defaults:
      run:
        working-directory: impl/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: impl/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Both corpora
        run: node dist/cli.js conformance

      # scaffold, gen and preview live in this implementation alone, so no corpus holds them (the
      # corpus README says why): tests of their own do — a draft, a derived contract and the
      # arithmetic byte for byte against golden files, and gen and preview writing nowhere they
      # were not told to.
      - name: scaffold, gen and preview, against fixtures of their own
        run: npm run test:unit

      - name: The rotten fixture must still fail
        run: |
          set +e
          node dist/cli.js check ../../tests/fixtures/library-service/usedesign.config.yaml
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "::error::the fixture exited $status; it carries seven planted errors and must exit 1"
            exit 1
          fi
          echo "fixture failed as designed"

  python:
    name: prototype (second runtime)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cards corpus
        run: python validate.py --conformance
      - name: Repository corpus
        run: python check.py --conformance

      # The starter kit's script is copied into a repository whole, so its test lives outside the
      # kit: what it leaves out of the inventory it names, and it counts the routes `scaffold`
      # counts on scaffold's own fixtures.
      - name: starter-kit's inventory-from-openapi.py
        working-directory: .
        run: python tests/starter-kit/test_inventory_from_openapi.py

  agreement:
    name: the two implementations agree
    needs: [typescript, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: impl/typescript/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci && npm run build
        working-directory: impl/typescript

      # Same input, same diagnostics — compared as text, because "both said it was broken" is not
      # agreement if they disagree about what is broken.
      - name: Same findings on the same fixture
        run: |
          set +e
          node impl/typescript/dist/cli.js check tests/fixtures/library-service/usedesign.config.yaml > /tmp/ts.txt
          (cd impl/python && python check.py ../../tests/fixtures/library-service/usedesign.config.yaml) > /tmp/py.txt
          set -e
          grep -oE '(ERROR|warning) +[a-z_]+' /tmp/ts.txt | sort > /tmp/ts.codes
          grep -oE '(ERROR|warning) +[a-z_]+' /tmp/py.txt | sort > /tmp/py.codes
          if ! diff -u /tmp/py.codes /tmp/ts.codes; then
            echo "::error::the implementations report different diagnostics for the same repository"
            exit 1
          fi
          echo "both implementations reported:"
          cat /tmp/ts.codes

      # What `validate` does with its paths is not a card verdict, so the corpora cannot hold it:
      # a path with nothing to validate is refused, a card whose front matter does not open the file
      # is an error, and contracts validated with cards have their `calls` read against them.
      - name: validate on its paths, both implementations
        run: bash tests/fixtures/validate-cli/run.sh

      # The same text, read alike: YAML both parsers read apart until 1.6.0, what the parser lets
      # through and both refuse, and text cut and matched as JavaScript does — in both.
      - name: the same YAML and text, both implementations
        run: KEEP_GOING=1 bash tests/fixtures/validate-cli/yaml.sh
