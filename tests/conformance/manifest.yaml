# Conformance corpus for the Operation Card format.
# Every implementation must reproduce these verdicts, including the diagnostic codes.
# See README.md for what each code means.

version: 1
cases:
  - file: valid/minimal.op.md
    expect: valid
    note: >-
      The lower bound of the format: nothing may be required beyond this.
  - file: valid/read-only-helper.op.md
    expect: valid
    note: >-
      serves_step satisfies the ownership rule; provenance: none is legal for reads.
  - file: valid/out-of-order-step-ids.op.md
    expect: valid
    note: >-
      Ids must never be treated as an ordering key.
  - file: valid/async-per-transport-quota.op.md
    expect: valid
    note: >-
      Per-transport overrides must not be flattened into the top-level rule.
  - file: invalid/no-owner.op.md
    expect: invalid
    codes: [no_owner]
  - file: invalid/in-production-without-deployed.op.md
    expect: invalid
    codes: [maturity_without_evidence]
  - file: invalid/tested-without-tests.op.md
    expect: invalid
    codes: [maturity_without_tests]
  - file: invalid/relaxed-concurrency-without-rationale.op.md
    expect: invalid
    codes: [relaxation_without_rationale]
  - file: invalid/test-covers-unknown-step.op.md
    expect: invalid
    codes: [unknown_step_reference]
  - file: invalid/ui-covers-unknown-step.op.md
    expect: invalid
    codes: [unknown_step_reference]
  - file: invalid/malformed-step-id.op.md
    expect: invalid
    codes: [malformed_step_id]
  - file: invalid/duplicate-step-id.op.md
    expect: invalid
    codes: [duplicate_step_id]
  - file: invalid/interface-without-transport.op.md
    expect: invalid
    codes: [missing_transport]
  - file: invalid/write-without-declared-effect.op.md
    expect: invalid
    codes: [write_without_effect]

  # ── Round 7 repairs: outcomes, continuation, variable targets, request handling ──────────────
  - file: valid/outcomes-and-continuation.op.md
    expect: valid
    codes: []
    note: >-
      Three terminal outcomes sharing one status code, and a continuation only a human can move.
      Two of the outcomes are successes that carry nothing — reaching the end and returning
      nothing IS the work. A validator that treats an empty answer as a failure fails here.
  - file: valid/undo-with-variable-target.op.md
    expect: valid
    codes: []
    note: >-
      `data_transition.to` as a set with `determined_by`. Every undo operation has this shape:
      it returns the record to where it was, not to where the card says.
  - file: invalid/undeclared-response.op.md
    expect: invalid
    codes: [undeclared_response]
    note: >-
      A step returns 500 while `responses` lists only 200 and 409. This exact defect sat in the
      project's own reference example until round 7, because nothing compared the two lists.
  - file: invalid/continuation-without-outcome.op.md
    expect: invalid
    codes: [continuation_without_outcome]
    note: >-
      The operation claims it can be suspended by an outcome it never declares.
  - file: invalid/decorative-parameter-not-in-path.op.md
    expect: invalid
    codes: [decorative_parameter_not_in_path]
    note: >-
      One parameter is wrongly declared decorative; the `clamped` entry beside it is correct and
      must not be reported. A checker that flags both has stopped reading the `handling` value.
  - file: valid/read-only-claiming-reversible.op.md
    expect: valid
    codes: []
    warnings: [reversibility_overstated]
    note: >-
      Valid but nonsensical, and the first corpus case whose whole point is a warning. Round 7
      found this in the project's own examples: `reversibility` is required, and until
      `not_applicable` existed, every read-only card had to say something untrue.
  - file: valid/bulk-violation-inside-success.op.md
    expect: valid
    codes: []
    warnings: [violation_with_success_status]
    note: >-
      A bulk operation whose per-item failures live inside a 200. Structurally valid, quietly
      false: `steps[]` assumes violated → stopped → error code, and a partial-success response
      fits none of that. From round 9, on a repository the format had never seen.
  - file: valid/bulk-with-per-item.op.md
    expect: valid
    codes: []
    note: >-
      A bulk operation written after round 9. `per_item` holds the per-item failures, which carry
      no status of their own, and `steps[]` holds only what stops the whole call.
  - file: invalid/per-item-failure-as-violation.op.md
    expect: invalid
    codes: [per_item_failure_as_violation]
    note: >-
      The same failure written as a step with a success status while `per_item` is declared. The
      rule tightens from warning to error exactly when the vocabulary to say it truthfully exists.
  - file: valid/continuation-on-job-state.op.md
    expect: valid
    codes: []
    note: >-
      `continuation.after` naming a job state rather than an outcome. Round 8 wrote this rule from
      one example and fitted it to that example; a request thread suspends on `done` and waits for
      a person. Axes E and F on one record — the evidence for keeping them apart.

  # ── Round 10: covers_outcomes — what the screen shows for each declared outcome ──────────────
  - file: valid/ui-covers-outcomes.op.md
    expect: valid
    codes: []
    warnings: [outcome_unshown]
    note: >-
      From tracing one real button: the screen showed two of four server outcomes and swallowed
      both errors in a bodyless catch. `unauthorized:` mapped to null is the honest claim that
      the outcome is not shown — a warning, never an error. Silent gaps are forbidden; honest
      ones are not.
  - file: invalid/covers-unknown-outcome.op.md
    expect: invalid
    codes: [covers_unknown_outcome]
    note: >-
      The map names an outcome nothing declares — the residue of a rename. Without the key check
      a renamed outcome leaves the map still looking fully covered.
  - file: invalid/outcome-not-covered.op.md
    expect: invalid
    codes: [outcome_not_covered]
    note: >-
      The map exists and one declared outcome is simply absent from it. That silence is exactly
      what the field forbids; the honest card writes the outcome as null and takes the warning.

  # ── Round 11: what the vocabulary is, and the third state between shown and hidden ───────────
  - file: valid/ui-covers-outcomes-not-job-states.op.md
    expect: valid
    codes: []
    note: >-
      The screen covers what the CALL can end with. Job states are the record's later life,
      watched through `observe_via` — a different operation with a screen of its own. Round 10
      let them leak in from the continuation rule, and the second card the rule ever met failed
      six times over, every error false. An implementation reporting `outcome_not_covered` for a
      job state still has that leak.
  - file: valid/ui-covers-per-item-failures.op.md
    expect: valid
    codes: []
    warnings: [outcome_unshown]
    note: >-
      Per-item failures are outcomes the user meets, and until round 11 nothing named them: they
      carry no status. Measured on a bulk screen whose client discards the response body — three
      of ten items rejected inside a 200, nothing shown. An implementation that omits per_item
      codes from the vocabulary accepts this card while the silence stays unsayable.
  - file: valid/outcomes-shown-identically.op.md
    expect: valid
    codes: []
    warnings: [outcomes_indistinguishable]
    note: >-
      Two outcomes wearing one sentence — the state between shown and not shown, and the one
      nobody notices. Measured on a real screen: 401 and 403 both surfaced as the same «try
      again», so the user who must give consent is told to do the one thing that cannot help.

  - file: valid/no-storage.op.md
    expect: valid
    codes: []
    note: >-
      Touches no storage at all — the build stamp comes from process configuration (issue #2).
      `entities: []` is the honest answer, and it is an answer: the list stays required so
      nobody forgets the question; empty says "none".
  - file: valid/read-with-audit.op.md
    expect: valid
    codes: []
    note: >-
      The audit-only read (issue #1): changes no domain state, records who asked. Before
      `records_only` this card picked between two lies. An implementation reporting
      write_without_effect here still forces the choice.

  # ── form contracts ───────────────────────────────────────────────────────────────────────────
  # The same `validate` command, told apart by `usedesign_form: 1`. Until 0.6.0 these documents
  # had no validator at all: `validate forms/` collected nothing and printed a green
  # "0 card(s): 0 error(s)" over a directory of broken contracts.
  - file: valid/forms/demo.session.panel.contract.md
    expect: valid
    codes: []
    note: >-
      Every section exercised: states, an operation call, a local control opening another form,
      an owner's removal. `opens` names a contract outside the file — with no known-forms set
      the link check stays silent, the restraint the card corpus applies to `reversible_via`.
  - file: invalid/forms/typo-section.contract.md
    expect: invalid
    codes: [missing_required_field, unknown_field]
    note: >-
      The measured hole, verbatim: `presents` misspelled as `presnts`. On 0.5.0 the whole
      "must show" section vanished silently and resurfaced as somebody else's warnings. Both
      codes are required — the unknown key names what happened, the absence names what it cost.
  - file: invalid/forms/duplicate-element.contract.md
    expect: invalid
    codes: [duplicate_element]
    note: >-
      One anchor, two meanings. The inventory can only prove the anchor once, so the second
      line is unverifiable by construction.
  - file: invalid/forms/duplicate-control.contract.md
    expect: invalid
    codes: [duplicate_control]
    note: >-
      Measured on 0.5.0: the duplicate was never named — every downstream finding about the
      control simply appeared twice. The defect multiplied instead of being reported.
  - file: invalid/forms/removed-also-required.contract.md
    expect: invalid
    codes: [removed_also_required]
    note: >-
      The contract disagreeing with itself: `clear-session` both required and forbidden. No
      code can satisfy it, so it is an error in the contract, not a TODO for the product.
  - file: invalid/forms/group-of-strangers.contract.md
    expect: invalid
    codes: [unknown_group_member]
    note: >-
      A group naming a member the contract never declares. Membership against the code is not
      verifiable yet (the inventory records anchors flat), but this is wrong by the contract's
      own text and needs no inventory to prove it.
  - file: invalid/forms/element-in-two-groups.contract.md
    expect: invalid
    codes: [element_in_two_groups]
    note: >-
      One element claimed by two groups. A rendered element sits in exactly one place; no
      screen can satisfy the contract, so the error is the contract's — the same family as
      requiring and forbidding one control.
  - file: valid/forms/family-and-states.contract.md
    expect: valid
    note: >-
      Round 17 in one document: `maturity: designed` (issue #8), a `states:` map from screen
      states to data states (issue #11), and anchor FAMILIES — `field_pattern` / `control_pattern`
      with `at_least`, a family seated in a group verbatim (issue #10). All optional; a contract
      without them behaves exactly as before.
  - file: invalid/forms/pattern-without-wildcard.contract.md
    expect: invalid
    codes: [pattern_without_wildcard]
    note: >-
      A "family" with no `*` is a literal wearing the wrong key. Accepted, it would silently
      match exactly one anchor while reading as "the set lives elsewhere".
  - file: invalid/forms/literal-and-pattern.contract.md
    expect: invalid
    codes: [literal_and_pattern]
    note: >-
      One line names one anchor or one family, never both — the inventory cannot tell two claims
      on one line apart, so the line is refused rather than guessed at.
  - file: invalid/forms/maturity-outside-vocabulary.contract.md
    expect: invalid
    codes: [invalid_enum_value]
    note: >-
      A form contract's maturity is two-valued (designed / implemented); a card's `tested` means
      nothing here — there is no evidence axis beyond "does the screen render".
  - file: invalid/forms/state-without-data.contract.md
    expect: invalid
    codes: [missing_required_field]
    note: >-
      Every `states:` entry must name its data state; an entry with only a note maps nowhere,
      and the checker would silently fall back to identity for it.
  - file: valid/from-set.op.md
    expect: valid
    note: >-
      Round 18: `data_transition.from` as a SET (the operation departs from any of three terminal
      states) and `concurrency.mode: etag_optional` (the revision is honoured when sent, not
      required). Both were forced lies before: `from: any` switched the shown_when rule off,
      and the mode vocabulary offered only etag_required or none_by_design.
  - file: invalid/from-set-of-one.op.md
    expect: invalid
    codes: [malformed_transition]
    note: >-
      A one-element `from` set is a string wearing brackets — two spellings of one fact drift
      apart in tooling that reads one and not the other. The author writes the string.
  - file: valid/tested-count-stale.op.md
    expect: valid
    codes: []
    warnings: [tested_count_mismatch]
    note: >-
      `maturity_evidence.tested` opens with a number that differs from the length of `tests[]`.
      Advisory prose stays valid; a number in it is a claim and is compared. Free text without a
      leading number is never compared.
  - file: valid/mutates-without-transition-reversible.op.md
    expect: valid
    codes: []
    warnings: []
    note: >-
      `data_transition: null` with a non-empty `mutates[]` is a write without a state change, not a
      read; `reversible` is a claim about that write and earns no `reversibility_overstated`. The
      same card without `mutates` still warns (valid/read-only-claiming-reversible).
