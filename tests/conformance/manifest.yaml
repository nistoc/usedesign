# Conformance corpus for the Operation Card format.
# Every implementation must reproduce these verdicts, including the diagnostic codes.
# See README.md for what each code means.

version: 1
cases:
  - file: valid/minimal.op.md
    expect: valid
    note: >-
      The lower bound of the format: nothing may be required beyond this.
  - file: valid/read-only-helper.op.md
    expect: valid
    note: >-
      serves_step satisfies the ownership rule; provenance: none is legal for reads.
  - file: valid/out-of-order-step-ids.op.md
    expect: valid
    note: >-
      Ids must never be treated as an ordering key.
  - file: valid/async-per-transport-quota.op.md
    expect: valid
    note: >-
      Per-transport overrides must not be flattened into the top-level rule.
  - file: invalid/no-owner.op.md
    expect: invalid
    codes: [no_owner]
  - file: invalid/in-production-without-deployed.op.md
    expect: invalid
    codes: [maturity_without_evidence]
  - file: invalid/tested-without-tests.op.md
    expect: invalid
    codes: [maturity_without_tests]
  - file: invalid/relaxed-concurrency-without-rationale.op.md
    expect: invalid
    codes: [relaxation_without_rationale]
  - file: invalid/test-covers-unknown-step.op.md
    expect: invalid
    codes: [unknown_step_reference]
  - file: invalid/ui-covers-unknown-step.op.md
    expect: invalid
    codes: [unknown_step_reference]
  - file: invalid/malformed-step-id.op.md
    expect: invalid
    codes: [malformed_step_id]
  - file: invalid/duplicate-step-id.op.md
    expect: invalid
    codes: [duplicate_step_id]
  - file: invalid/interface-without-transport.op.md
    expect: invalid
    codes: [missing_transport]
  - file: invalid/write-without-declared-effect.op.md
    expect: invalid
    codes: [write_without_effect]

  # ── Round 7 repairs: outcomes, continuation, variable targets, request handling ──────────────
  - file: valid/outcomes-and-continuation.op.md
    expect: valid
    codes: []
    note: >-
      Three terminal outcomes sharing one status code, and a continuation only a human can move.
      Two of the outcomes are successes that carry nothing — reaching the end and returning
      nothing IS the work. A validator that treats an empty answer as a failure fails here.
  - file: valid/undo-with-variable-target.op.md
    expect: valid
    codes: []
    note: >-
      `data_transition.to` as a set with `determined_by`. Every undo operation has this shape:
      it returns the record to where it was, not to where the card says.
  - file: invalid/undeclared-response.op.md
    expect: invalid
    codes: [undeclared_response]
    note: >-
      A step returns 500 while `responses` lists only 200 and 409. This exact defect sat in the
      project's own reference example until round 7, because nothing compared the two lists.
  - file: invalid/continuation-without-outcome.op.md
    expect: invalid
    codes: [continuation_without_outcome]
    note: >-
      The operation claims it can be suspended by an outcome it never declares.
  - file: invalid/decorative-parameter-not-in-path.op.md
    expect: invalid
    codes: [decorative_parameter_not_in_path]
    note: >-
      One parameter is wrongly declared decorative; the `clamped` entry beside it is correct and
      must not be reported. A checker that flags both has stopped reading the `handling` value.
  - file: valid/read-only-claiming-reversible.op.md
    expect: valid
    codes: []
    warnings: [reversibility_overstated]
    note: >-
      Valid but nonsensical, and the first corpus case whose whole point is a warning. Round 7
      found this in the project's own examples: `reversibility` is required, and until
      `not_applicable` existed, every read-only card had to say something untrue.
  - file: valid/bulk-violation-inside-success.op.md
    expect: valid
    codes: []
    warnings: [violation_with_success_status]
    note: >-
      A bulk operation whose per-item failures live inside a 200. Structurally valid, quietly
      false: `steps[]` assumes violated → stopped → error code, and a partial-success response
      fits none of that. From round 9, on a repository the format had never seen.
  - file: valid/bulk-with-per-item.op.md
    expect: valid
    codes: []
    note: >-
      A bulk operation written after round 9. `per_item` holds the per-item failures, which carry
      no status of their own, and `steps[]` holds only what stops the whole call.
  - file: invalid/per-item-failure-as-violation.op.md
    expect: invalid
    codes: [per_item_failure_as_violation]
    note: >-
      The same failure written as a step with a success status while `per_item` is declared. The
      rule tightens from warning to error exactly when the vocabulary to say it truthfully exists.
  - file: valid/continuation-on-job-state.op.md
    expect: valid
    codes: []
    note: >-
      `continuation.after` naming a job state rather than an outcome. Round 8 wrote this rule from
      one example and fitted it to that example; a request thread suspends on `done` and waits for
      a person. Axes E and F on one record — the evidence for keeping them apart.

  # ── Round 10: covers_outcomes — what the screen shows for each declared outcome ──────────────
  - file: valid/ui-covers-outcomes.op.md
    expect: valid
    codes: []
    warnings: [outcome_unshown]
    note: >-
      From tracing one real button: the screen showed two of four server outcomes and swallowed
      both errors in a bodyless catch. `unauthorized:` mapped to null is the honest claim that
      the outcome is not shown — a warning, never an error. Silent gaps are forbidden; honest
      ones are not.
  - file: invalid/covers-unknown-outcome.op.md
    expect: invalid
    codes: [covers_unknown_outcome]
    note: >-
      The map names an outcome nothing declares — the residue of a rename. Without the key check
      a renamed outcome leaves the map still looking fully covered.
  - file: invalid/outcome-not-covered.op.md
    expect: invalid
    codes: [outcome_not_covered]
    note: >-
      The map exists and one declared outcome is simply absent from it. That silence is exactly
      what the field forbids; the honest card writes the outcome as null and takes the warning.
