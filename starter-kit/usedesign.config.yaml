# Конфиг usedesign — образец для серверного репозитория. Скопируйте в usedesign/ и поправьте
# пути. Всё, что закомментировано, — необязательное: начинайте с малого.
usedesign_config: 1

# Карточки операций. Глоб относительно этого файла.
cards:
  - cards/*.op.md

# Перечень маршрутов — порождается на каждый прогон из OpenAPI работающего приложения
# (tools/inventory-from-openapi.py), в репозитории НЕ хранится: сверяться со вчерашним
# снимком значило бы называть это проверкой.
inventory: route-inventory.json

# JUnit-отчёт тестового прогона — тоже порождается на каждый прогон.
test_report: test-report.xml

# Корень кода для проверки путей-улик из maturity_evidence.
code_root: ..

# Маршруты, которые сознательно не описываются. Каждое исключение обязано нести причину —
# и в сводке проверки видно, сколько маршрутов скрыто каждым правилом.
exclude:
  - path: /health
    reason: инфраструктурная проба живости, не операция предметной области

# ── вторая волна ─────────────────────────────────────────────────────────────
# Хранилище (проверка №4): перечень снимается с живой базы своим скриптом.
# storage_inventory: storage-inventory.json

# Контракты форм (проверка №5) — обычно живут в репозитории ФРОНТА со своим конфигом,
# в котором объявлена область: checks: [5]. См. SPEC §7.5–7.6.
# forms:
#   - forms/*.contract.md
# form_inventory: form-inventory.json
